<!doctype html>
<!-- Source of cover.png (1280x640). Re-render with headless Edge/Chrome:
     msedge --headless=new --hide-scrollbars --window-size=1280,640 --screenshot=cover.png cover.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0f1b2d;
    color: #f4f6fa;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .text { position: absolute; left: 72px; top: 70px; width: 600px; }
  .kicker { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; color: #8fb3e8; font-weight: 600; }
  h1 { margin: 18px 0 0; font-size: 62px; line-height: 1.04; font-weight: 800; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #ff8a5c; }
  .repo { margin-top: 22px; font-family: Consolas, "Courier New", monospace; font-size: 24px; color: #c9d4e5; }
  .chips { margin-top: 30px; display: flex; gap: 12px; }
  .chip { border: 2px solid #33496b; border-radius: 12px; padding: 9px 14px; font-size: 20px; color: #e6ecf5; white-space: nowrap; }
  .chip b { color: #ffffff; }
  .keys { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 12px; align-items: flex-end; }
  .key {
    width: 58px; height: 58px; border-radius: 12px; background: #e9edf3; color: #0f1b2d;
    font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -6px 0 #b9c3d1;
  }
  .key.on { background: #ff8a5c; box-shadow: inset 0 -6px 0 #c95b33; color: #fff; }
  .keys .gap { width: 26px; }
  .keys .caption { margin-left: 18px; font-size: 20px; color: #8fa3c0; line-height: 1.3; }
  svg { position: absolute; right: 0; top: 0; }
</style>
</head>
<body>
  <div class="text">
    <div class="kicker">PPO · Playwright · official browser game</div>
    <h1>An agent that learned to finish <em>100 m</em> in QWOP</h1>
    <div class="repo">NatLee/play-qwop-by-using-ai-agent</div>
    <div class="chips">
      <div class="chip"><b>100 m</b> in 194 s</div>
      <div class="chip"><b>22 min</b> of training</div>
      <div class="chip"><b>3/3</b> races finished</div>
    </div>
  </div>
  <div class="keys">
    <div class="key on">Q</div><div class="key">W</div><div class="gap"></div>
    <div class="key">O</div><div class="key on">P</div>
    <div class="caption">four keys,<br>two legs</div>
  </div>

  <svg width="600" height="640" viewBox="0 0 600 640">
    <!-- learning curve motif: distance per race rising over training -->
    <g transform="translate(40 40) scale(1 0.62)">
      <line x1="0" y1="330" x2="460" y2="330" stroke="#33496b" stroke-width="2"/>
      <line x1="0" y1="20" x2="460" y2="20" stroke="#33496b" stroke-width="2" stroke-dasharray="2 8"/>
      <text x="470" y="26" fill="#8fa3c0" font-size="20" transform="scale(1 1.6)" transform-origin="470 26">100 m</text>
      <text x="470" y="336" fill="#8fa3c0" font-size="20" transform="scale(1 1.6)" transform-origin="470 336">0 m</text>
      <polyline fill="none" stroke="#3987e5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"
        points="0,328 40,326 80,322 120,318 150,300 180,262 210,215 240,170 270,140 300,118 330,100 360,86 400,70 440,60"/>
      <polyline fill="none" stroke="#ff8a5c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"
        points="0,325 60,318 100,300 140,250 170,190 200,120 230,80 260,48 290,32 320,20 460,20"/>
    </g>
    <circle cx="360" cy="52.4" r="9" fill="#ff8a5c" stroke="#0f1b2d" stroke-width="4"/>
    <!-- track -->
    <rect x="0" y="470" width="600" height="170" fill="#b8492f"/>
    <line x1="0" y1="500" x2="600" y2="500" stroke="#f1d2c7" stroke-width="4"/>
    <line x1="0" y1="560" x2="600" y2="560" stroke="#f1d2c7" stroke-width="4"/>
    <line x1="0" y1="620" x2="600" y2="620" stroke="#f1d2c7" stroke-width="4"/>
    <rect x="455" y="470" width="14" height="170" fill="#f4f6fa"/>
    <!-- stylised runner, mid-stride, crossing the line -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(395 300)">
      <path d="M0 95 L-38 140 L-72 168" stroke="#8a5536" stroke-width="22"/>
      <path d="M-72 168 L-84 166" stroke="#f4f6fa" stroke-width="16"/>
      <path d="M-4 18 L-40 60 L-26 96" stroke="#8a5536" stroke-width="15"/>
      <path d="M0 95 L52 128 L44 186" stroke="#a8693f" stroke-width="22"/>
      <path d="M44 186 L68 188" stroke="#f4f6fa" stroke-width="16"/>
      <path d="M2 10 L4 96" stroke="#d6453c" stroke-width="40"/>
      <path d="M8 20 L44 48 L62 22" stroke="#a8693f" stroke-width="15"/>
      <circle cx="10" cy="-26" r="25" fill="#a8693f" stroke="none"/>
      <path d="M-14 -40 Q8 -62 32 -36" stroke="#2b1c14" stroke-width="12"/>
    </g>
  </svg>
</body>
</html>
